<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="toolbar">
    <button id="clear" class="icon-btn" title="Clear logs (Ctrl+L)">🚫</button>
    <span class="sep"></span>
    <input id="filter" type="text" placeholder="Filter path / traceId ..." />
    <span class="sep"></span>
    <div class="filter-pills">
      <button class="pill active" data-type="ALL">All</button>
      <button class="pill" data-type="http">HTTP</button>
      <button class="pill" data-type="websocket">WebSocket</button>
    </div>
    <span id="count" class="count">0 entries</span>
  </header>

  <main id="workspace">
    <section id="list-pane">
      <div class="grid-row head">
        <span class="col-status">Status</span>
        <span class="col-method">Method</span>
        <span class="col-name">Name</span>
        <span class="col-type">Type</span>
        <span class="col-time">Duration</span>
        <span class="col-start">Start Time</span>
      </div>
      <div id="list"></div>
    </section>

    <div id="resizer" class="hidden" title="Drag to resize"></div>

    <aside id="detail" class="hidden">
      <div class="detail-tabs">
        <button id="detail-close" class="tab-close" title="Close (Esc)">×</button>
        <button class="tab-btn active" data-tab="headers">Headers</button>
        <button class="tab-btn" data-tab="payload">Payload</button>
        <button class="tab-btn" data-tab="response">Response</button>
        <span id="detail-path" class="tab-path"></span>
      </div>

      <div class="detail-content">
        <div id="tab-headers" class="tab-pane active">
          <div id="hdr-body"></div>
        </div>
        <div id="tab-payload" class="tab-pane">
          <div class="pane-actions">
            <button id="copy-req" class="copy-btn">Copy Payload</button>
          </div>
          <div id="req-body" class="json-view"></div>
        </div>
        <div id="tab-response" class="tab-pane">
          <div class="pane-actions">
            <button id="copy-resp" class="copy-btn">Copy Response</button>
          </div>
          <div id="resp-body" class="json-view"></div>
        </div>
      </div>
    </aside>
  </main>

  <div id="ctx-menu" class="ctx-menu hidden">
    <div class="ctx-item" data-action="copy-req">Copy Request Payload (JSON)</div>
    <div class="ctx-item" data-action="copy-resp">Copy Response Result (JSON)</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="copy-path">Copy Request Path</div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
