<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="toolbar">
    <span class="brand">HBuf RPC</span>
    <input id="filter" type="text" placeholder="过滤 path / traceId ...">
    <button id="clear">清空</button>
    <button id="f-http" class="toggle" data-type="http" title="只显示 HTTP 请求">HTTP</button>
    <button id="f-ws" class="toggle" data-type="websocket" title="只显示 WebSocket 请求">WebSocket</button>
    <span id="count" class="count"></span>
  </header>
  <main>
    <div id="table-wrap">
      <div class="grid-row head">
        <span class="col-status">状态</span>
        <span class="col-method">方法</span>
        <span class="col-name">名称</span>
        <span class="col-type">类型</span>
        <span class="col-time">耗时</span>
        <span class="col-start">开始时间</span>
      </div>
      <div id="list"></div>
    </div>
    <section id="detail" class="hidden">
      <div class="detail-head">
        <span id="detail-path"></span>
        <span id="detail-meta"></span>
        <button id="detail-close" title="关闭">×</button>
      </div>
      <div id="hdr-panel">
        <div class="col-title hdr-toggle" title="点击展开/收起">请求头 <span id="hdr-arrow">▾</span></div>
        <div id="hdr-body"></div>
      </div>
      <div class="detail-cols">
        <div class="detail-col">
          <div class="col-title">请求</div>
          <div id="req-body" class="json-view"></div>
        </div>
        <div class="detail-col">
          <div class="col-title">响应</div>
          <div id="resp-body" class="json-view"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="panel.js"></script>
</body>
</html>
